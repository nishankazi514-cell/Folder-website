<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDXbet - Register & Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0F0F12; color: #FFFFFF; font-family: system-ui, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); }
    .glass-input:focus { border-color: #FF007A; box-shadow: 0 0 10px rgba(255, 0, 122, 0.25); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 bg-[#0F0F12]">

  <div class="w-full max-w-md mx-auto flex flex-col flex-1 justify-center">
    <header class="flex items-center justify-between mb-6">
      <button class="w-10 h-10 flex items-center justify-center rounded-xl glass-card text-gray-300">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <h1 class="text-2xl font-black text-white">BDX<span class="text-[#FF007A]">bet</span></h1>
      <select class="glass-card text-xs py-2 px-3 rounded-xl text-white bg-[#0F0F12]">
        <option value="en">EN</option>
        <option value="bn">BN</option>
      </select>
    </header>

    <!-- Register Card -->
    <main id="registerCard" class="glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden">
      <div class="mb-6 text-center">
        <h2 class="text-xl font-bold text-white mb-1">Create an Account</h2>
        <p class="text-xs text-gray-400">Join BDXbet for live sports & gaming</p>
      </div>

      <form onsubmit="handleAuth(event, 'register')" class="space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-300">Phone or Email</label>
          <input type="text" id="regAccount" required placeholder="01700000000 or mail@example.com" class="w-full glass-input text-xs py-3 px-3 rounded-xl text-white outline-none">
        </div>

        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-300">Password</label>
          <input type="password" id="regPassword" required placeholder="Enter password" class="w-full glass-input text-xs py-3 px-3 rounded-xl text-white outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#FF007A] to-[#FF4D9E] text-white text-sm font-bold rounded-xl shadow-lg">REGISTER</button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-400">
        Already have an account? 
        <button type="button" onclick="toggleForm('login')" class="text-[#FF007A] font-semibold hover:underline">Log In</button>
      </div>
    </main>

    <!-- Login Card -->
    <main id="loginCard" class="glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden hidden">
      <div class="mb-6 text-center">
        <h2 class="text-xl font-bold text-white mb-1">Welcome Back!</h2>
        <p class="text-xs text-gray-400">Log in to your BDXbet account</p>
      </div>

      <form onsubmit="handleAuth(event, 'login')" class="space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-300">Phone or Email</label>
          <input type="text" id="loginAccount" required placeholder="Enter phone or email" class="w-full glass-input text-xs py-3 px-3 rounded-xl text-white outline-none">
        </div>

        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-300">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter password" class="w-full glass-input text-xs py-3 px-3 rounded-xl text-white outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#FF007A] to-[#FF4D9E] text-white text-sm font-bold rounded-xl shadow-lg">LOG IN</button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-400">
        Don't have an account? 
        <button type="button" onclick="toggleForm('register')" class="text-[#FF007A] font-semibold hover:underline">Register</button>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    function toggleForm(view) {
      document.getElementById('registerCard').classList.toggle('hidden', view === 'login');
      document.getElementById('loginCard').classList.toggle('hidden', view === 'register');
    }

    async function handleAuth(event, type) {
      event.preventDefault();
      const isReg = type === 'register';
      const phoneOrEmail = document.getElementById(isReg ? 'regAccount' : 'loginAccount').value;
      const password = document.getElementById(isReg ? 'regPassword' : 'loginPassword').value;

      try {
        const res = await fetch(`/api/v1/auth/${type}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneOrEmail, password })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success && !isReg) {
          localStorage.setItem('bdx_token', data.token);
        }
      } catch(e) {
        alert("সার্ভার কানেকশন এরর!");
      }
    }
  </script>
</body>
</html>
