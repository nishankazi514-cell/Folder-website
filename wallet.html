<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINKWIN - Wallet System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0F0F12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 122, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-nav {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 0, 122, 0.2);
        }

        .pink-glow {
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.4);
        }

        .pink-glow-hover:hover {
            box-shadow: 0 0 25px rgba(255, 0, 122, 0.7);
            transform: translateY(-2px);
        }

        .bg-pink-gradient {
            background: linear-gradient(135deg, #FF007A 0%, #E91E63 100%);
        }

        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <div class="fixed top-0 right-1/4 w-96 h-96 bg-[#FF007A] opacity-10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-20 left-10 w-80 h-80 bg-[#E91E63] opacity-10 rounded-full blur-3xl pointer-events-none"></div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div class="max-w-md mx-auto min-h-screen relative z-10 p-4 space-y-5">

        <header class="flex items-center justify-between py-2">
            <button class="text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-base font-bold tracking-wide text-white">Wallet Center</h1>
            <button class="text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i>
            </button>
        </header>

        <div class="glass-card rounded-2xl p-5 relative overflow-hidden">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-xs text-gray-400 font-medium">Total Balance</span>
                    <h2 class="text-2xl font-black text-white mt-1">৳ <span id="userBalance">12,450.00</span></h2>
                </div>
                <span class="bg-[#FF007A]/20 text-[#FF007A] text-[10px] font-bold px-2.5 py-1 rounded-full border border-[#FF007A]/30">VIP Level 2</span>
            </div>

            <div class="relative flex bg-black/40 p-1 rounded-xl mt-5 border border-white/5">
                <div id="modeIndicator" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-pink-gradient rounded-lg transition-all duration-300 ease-in-out"></div>
                <button id="depositTabBtn" onclick="switchWalletMode('deposit')" class="relative z-10 w-1/2 py-2.5 text-xs font-bold text-white transition-colors">
                    <i class="fa-solid fa-arrow-down-left mr-1.5"></i> Deposit
                </button>
                <button id="withdrawTabBtn" onclick="switchWalletMode('withdraw')" class="relative z-10 w-1/2 py-2.5 text-xs font-bold text-gray-400 transition-colors">
                    <i class="fa-solid fa-arrow-up-right mr-1.5"></i> Withdraw
                </button>
            </div>
        </div>

        <section>
            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">Select Payment Method</h3>
            <div class="grid grid-cols-3 gap-2.5">
                <button onclick="selectGateway(this, 'bkash', '01700000000')" class="gateway-card glass-card p-3 rounded-xl border-[#FF007A] flex flex-col items-center justify-center gap-1.5 transition-all text-[#FF007A] relative">
                    <i class="fa-solid fa-mobile-retro text-2xl"></i>
                    <span class="text-xs font-bold text-white">bKash</span>
                    <span class="text-[9px] text-gray-400">Cash Out</span>
                </button>

                <button onclick="selectGateway(this, 'nagad', '01800000000')" class="gateway-card glass-card p-3 rounded-xl border-white/10 flex flex-col items-center justify-center gap-1.5 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-wallet text-2xl"></i>
                    <span class="text-xs font-bold text-white">Nagad</span>
                    <span class="text-[9px] text-gray-400">Send Money</span>
                </button>

                <button onclick="selectGateway(this, 'rocket', '01900000000')" class="gateway-card glass-card p-3 rounded-xl border-white/10 flex flex-col items-center justify-center gap-1.5 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-paper-plane text-2xl"></i>
                    <span class="text-xs font-bold text-white">Rocket</span>
                    <span class="text-[9px] text-gray-400">Cash Out</span>
                </button>

                <button onclick="selectGateway(this, 'upay', '01600000000')" class="gateway-card glass-card p-3 rounded-xl border-white/10 flex flex-col items-center justify-center gap-1.5 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-circle-dollar-to-slot text-2xl"></i>
                    <span class="text-xs font-bold text-white">Upay</span>
                    <span class="text-[9px] text-gray-400">Send Money</span>
                </button>

                <button onclick="selectGateway(this, 'usdt', '0x71C7656EC7ab88b098defB751B7401B5f6d8976F')" class="gateway-card glass-card p-3 rounded-xl border-white/10 flex flex-col items-center justify-center gap-1.5 transition-all text-gray-400 hover:text-white">
                    <i class="fa-brands fa-bitcoin text-2xl"></i>
                    <span class="text-xs font-bold text-white">USDT</span>
                    <span class="text-[9px] text-gray-400">TRC20 / BEP20</span>
                </button>
            </div>
        </section>

        <section id="instructionBox" class="glass-card rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-white/10 pb-2">
                <span class="text-xs text-gray-400 font-semibold">Agent <span id="gatewayNameTitle">bKash</span> Address/Number:</span>
                <span class="text-[10px] bg-green-500/20 text-green-400 font-bold px-2 py-0.5 rounded">Active</span>
            </div>
            
            <div class="flex items-center justify-between bg-black/40 p-3 rounded-xl border border-white/5">
                <span id="agentNumberText" class="font-mono text-sm font-bold text-[#FF007A] tracking-wider">01700000000</span>
                <button onclick="copyAgentNumber()" class="text-xs bg-white/10 hover:bg-white/20 text-white font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>

            <p class="text-[11px] text-gray-400 leading-relaxed">
                <i class="fa-solid fa-circle-info text-[#FF007A] mr-1"></i>
                <span id="instructionText">Send the exact amount to the Agent number above, then submit the Transaction ID (TrxID) below.</span>
            </p>
        </section>

        <section class="glass-card rounded-2xl p-5 space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Enter Amount (৳)</label>
                <div class="relative">
                    <input type="number" id="amountInput" placeholder="Minimum ৳ 100" 
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-base font-bold text-white placeholder-gray-500 outline-none focus:border-[#FF007A] transition-all">
                    <span class="absolute right-4 top-3.5 text-xs text-gray-400 font-bold">BDT</span>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="setQuickAmount(100)" class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg py-2 text-xs font-bold text-gray-300 transition-all">৳ 100</button>
                <button onclick="setQuickAmount(500)" class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg py-2 text-xs font-bold text-gray-300 transition-all">৳ 500</button>
                <button onclick="setQuickAmount(1000)" class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg py-2 text-xs font-bold text-gray-300 transition-all">৳ 1,000</button>
                <button onclick="setQuickAmount(5000)" class="bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg py-2 text-xs font-bold text-gray-300 transition-all">৳ 5,000</button>
            </div>

            <div id="trxIdContainer">
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Transaction ID (TrxID)</label>
                <input type="text" id="trxIdInput" placeholder="e.g. 9J7X8KL9M" 
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none focus:border-[#FF007A] transition-all">
            </div>

            <div id="receiptContainer">
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Upload Payment Receipt <span class="text-gray-500">(Optional)</span></label>
                <label class="flex items-center justify-center w-full h-12 border-2 border-dashed border-white/10 hover:border-[#FF007A] rounded-xl cursor-pointer bg-white/5 transition-all">
                    <span id="fileNameDisplay" class="text-xs text-gray-400 flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-sm text-[#FF007A]"></i> Choose Screenshot
                    </span>
                    <input type="file" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
                </label>
            </div>

            <button id="submitBtn" onclick="handleWalletSubmit()" 
                class="w-full py-4 rounded-xl bg-pink-gradient font-bold text-sm tracking-wide text-white uppercase pink-glow pink-glow-hover transition-all duration-300 mt-2">
                Confirm Payment
            </button>
        </section>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav max-w-md mx-auto">
        <div class="flex items-center justify-around py-2">
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] font-semibold">Activity</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white relative">
                <div class="w-10 h-10 -mt-5 rounded-full bg-pink-gradient flex items-center justify-center text-white pink-glow">
                    <i class="fa-solid fa-gift text-lg"></i>
                </div>
                <span class="text-[10px] font-semibold">Promo</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-[#FF007A]">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[10px] font-bold">Wallet</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-semibold">Account</span>
            </button>
        </div>
    </nav>

    <script>
        const API_BASE_URL = 'https://my-website-o8np.onrender.com';
        let currentMode = 'deposit';
        let selectedGatewayName = 'bKash';
        let currentAgentNumber = '01700000000';

        function switchWalletMode(mode) {
            currentMode = mode;
            const modeIndicator = document.getElementById('modeIndicator');
            const depositBtn = document.getElementById('depositTabBtn');
            const withdrawBtn = document.getElementById('withdrawTabBtn');
            const submitBtn = document.getElementById('submitBtn');
            const trxIdContainer = document.getElementById('trxIdContainer');
            const receiptContainer = document.getElementById('receiptContainer');
            const instructionText = document.getElementById('instructionText');

            if (mode === 'deposit') {
                modeIndicator.style.left = '4px';
                depositBtn.classList.add('text-white');
                depositBtn.classList.remove('text-gray-400');
                withdrawBtn.classList.add('text-gray-400');
                withdrawBtn.classList.remove('text-white');
                
                submitBtn.textContent = 'Confirm Payment';
                trxIdContainer.style.display = 'block';
                receiptContainer.style.display = 'block';
                instructionText.textContent = 'Send the exact amount to the Agent number above, then submit the Transaction ID (TrxID) below.';
            } else {
                modeIndicator.style.left = 'calc(50%)';
                withdrawBtn.classList.add('text-white');
                withdrawBtn.classList.remove('text-gray-400');
                depositBtn.classList.add('text-gray-400');
                depositBtn.classList.remove('text-white');

                submitBtn.textContent = 'Submit Withdrawal Request';
                trxIdContainer.style.display = 'block';
                receiptContainer.style.display = 'none';
                instructionText.textContent = 'Enter your account/wallet details below where you wish to receive the withdrawal funds.';
            }
        }

        function selectGateway(cardElement, name, number) {
            const allCards = document.querySelectorAll('.gateway-card');
            allCards.forEach(card => {
                card.classList.remove('border-[#FF007A]', 'text-[#FF007A]');
                card.classList.add('border-white/10', 'text-gray-400');
            });

            cardElement.classList.add('border-[#FF007A]', 'text-[#FF007A]');
            cardElement.classList.remove('border-white/10', 'text-gray-400');

            selectedGatewayName = name.toUpperCase();
            currentAgentNumber = number;

            document.getElementById('gatewayNameTitle').textContent = selectedGatewayName;
            document.getElementById('agentNumberText').textContent = currentAgentNumber;
        }

        function setQuickAmount(amount) {
            document.getElementById('amountInput').value = amount;
        }

        function copyAgentNumber() {
            navigator.clipboard.writeText(currentAgentNumber).then(() => {
                showToast(`Copied ${selectedGatewayName} number to clipboard!`, 'success');
            }).catch(() => {
                showToast('Failed to copy to clipboard', 'error');
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            if (file) {
                fileNameDisplay.innerHTML = `<i class="fa-solid fa-file-check text-[#FF007A]"></i> ${file.name}`;
            }
        }

        function showToast(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-[#FF007A]';
            
            toast.className = `${bgColor} text-white text-xs px-4 py-3 rounded-xl shadow-lg animate-toast flex items-center gap-2 min-w-[200px] border border-white/20`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        async function handleWalletSubmit() {
            const amount = document.getElementById('amountInput').value;
            const trxId = document.getElementById('trxIdInput').value;
            const token = localStorage.getItem('token');

            if (!amount || parseFloat(amount) < 100) {
                showToast('Please enter a valid amount (Minimum ৳ 100)');
                return;
            }

            if (!trxId) {
                showToast(currentMode === 'deposit' ? 'Please enter Transaction ID' : 'Please enter target Wallet Account Number');
                return;
            }

            if (currentMode === 'deposit') {
                if (!token) {
                    showToast('Please login first');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/wallet/deposit`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ gateway: selectedGatewayName, amount: Number(amount), trxId })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showToast('Deposit request submitted! Pending approval.', 'success');
                    } else {
                        showToast(data.message || 'Deposit submission failed');
                    }
                } catch (err) {
                    showToast('Server connection error. Please try again.');
                }
            } else {
                showToast('Withdrawal request submitted successfully!', 'success');
            }
        }
    </script>
</body>
</html>
