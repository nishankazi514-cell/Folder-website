<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDXbet - ওয়ালেট ও পেমেন্ট প্রসেসর</title>
    <style>
        :root {
            --bg-dark: #0F0F12;
            --card-surface: #18181C;
            --neon-pink: #FF007A;
            --rose-pink: #E91E63;
            --text-main: #FFFFFF;
            --text-sub: #A0A0AB;
            --gold-accent: #FF9900;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            user-select: none;
        }

        .header-bar {
            max-width: 440px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFF;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .wallet-card {
            max-width: 440px;
            margin: 0 auto;
            background: var(--card-surface);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(255, 0, 122, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .gateway-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .gateway-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gateway-card.selected {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 122, 0.12);
            box-shadow: 0 0 12px rgba(255, 0, 122, 0.3);
        }

        .gateway-title { font-weight: 700; font-size: 13px; }

        .quick-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .chip-item {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .chip-item:hover, .chip-item:active {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 122, 0.15);
        }

        .instruction-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--neon-pink);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .btn-copy-action {
            background: var(--neon-pink);
            color: #FFF;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-copy-action:active { opacity: 0.8; }

        .field-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #FFF;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-input:focus { border-color: var(--neon-pink); }

        .btn-pay-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-pink), var(--rose-pink));
            border: none;
            color: #FFF;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 0, 122, 0.4);
        }

        .btn-pay-submit:active { opacity: 0.85; }
    </style>
</head>
<body>

<div class="header-bar">
    <a href="dashboard.html" class="btn-back">⬅ ড্যাশবোর্ড</a>
    <span style="font-weight: 700; font-size: 14px;">BDX<span style="color: var(--neon-pink);">bet</span> Wallet</span>
</div>

<div class="wallet-card">
    <h3 style="font-size: 18px; margin-bottom: 4px;">ডিপোজিট ওয়ালেট</h3>
    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 16px;">পেমেন্ট গেটওয়ে নির্বাচন করে লেনদেন সম্পন্ন করুন।</p>

    <div class="gateway-grid">
        <div class="gateway-card selected" onclick="updateGateway(this, '01711223344', 'bKash')">
            <div class="gateway-title" style="color: #DF146E;">bKash</div>
            <span style="font-size: 10px; color: var(--text-sub);">ক্যাশ আউট</span>
        </div>
        <div class="gateway-card" onclick="updateGateway(this, '01811223344', 'Nagad')">
            <div class="gateway-title" style="color: #F7921E;">Nagad</div>
            <span style="font-size: 10px; color: var(--text-sub);">ক্যাশ আউট</span>
        </div>
        <div class="gateway-card" onclick="updateGateway(this, 'T9xTYz...TRC20', 'USDT')">
            <div class="gateway-title" style="color: #26A17B;">USDT</div>
            <span style="font-size: 10px; color: var(--text-sub);">TRC20 Network</span>
        </div>
    </div>

    <div class="instruction-box">
        <div>
            <div style="font-size: 10px; color: var(--text-sub);" id="gwLabel">bKash অফিশিয়াল ঠিকানা</div>
            <div id="agentAccount" style="font-weight: 700; font-size: 15px; color: var(--gold-accent);">01711223344</div>
        </div>
        <button class="btn-copy-action" onclick="copyWalletAddress()">কপি</button>
    </div>

    <label style="font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px;">পরিমাণ (BDT)</label>
    <div class="quick-selector">
        <div class="chip-item" onclick="assignAmount(500)">৳৫০০</div>
        <div class="chip-item" onclick="assignAmount(1000)">৳১,০০০</div>
        <div class="chip-item" onclick="assignAmount(5000)">৳৫,০০০</div>
        <div class="chip-item" onclick="assignAmount(10000)">৳১০,০০০</div>
    </div>
    <input type="number" id="depositVal" class="field-input" placeholder="টাকার পরিমাণ টাইপ করুন">

    <label style="font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px;">ট্রানজেকশন আইডি (TrxID)</label>
    <input type="text" id="trxIdVal" class="field-input" placeholder="8N7M6K5L4J">

    <button class="btn-pay-submit" onclick="submitTransaction()">পেমেন্ট কনফার্ম করুন</button>
</div>

<script>
    let activeGateway = 'bKash';

    function updateGateway(cardEl, accNum, name) {
        document.querySelectorAll('.gateway-card').forEach(c => c.classList.remove('selected'));
        cardEl.classList.add('selected');
        activeGateway = name;
        document.getElementById('agentAccount').innerText = accNum;
        document.getElementById('gwLabel').innerText = name + " অফিশিয়াল ঠিকানা";
    }

    function assignAmount(amount) {
        document.getElementById('depositVal').value = amount;
    }

    function copyWalletAddress() {
        const addr = document.getElementById('agentAccount').innerText;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(addr).then(() => {
                alert("কপি করা হয়েছে: " + addr);
            }).catch(() => fallbackCopy(addr));
        } else {
            fallbackCopy(addr);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
        alert("কপি করা হয়েছে: " + text);
    }

    async function submitTransaction() {
        const amt = document.getElementById('depositVal').value;
        const trx = document.getElementById('trxIdVal').value.trim();
        const token = localStorage.getItem('bdx_token');

        if (!token) {
            alert("অনুগ্রহ করে প্রথমে লগইন করুন।");
            window.location.href = 'index.html';
            return;
        }

        if (!amt || Number(amt) <= 0) {
            alert("অনুগ্রহ করে সঠিক জমা করার পরিমাণ লিখুন।");
            return;
        }

        if (!trx) {
            alert("অনুগ্রহ করে ট্রানজেকশন আইডি (TrxID) প্রদান করুন।");
            return;
        }

        try {
            const res = await fetch('/api/v1/wallet/deposit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ gateway: activeGateway, amount: Number(amt), trxId: trx })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                document.getElementById('depositVal').value = '';
                document.getElementById('trxIdVal').value = '';
            }
        } catch(e) {
            alert("নেটওয়ার্ক বা সার্ভারে সমস্যা হয়েছে! পরে আবার চেষ্টা করুন।");
        }
    }
</script>
</body>
</html>
